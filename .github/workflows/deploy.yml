name: deploy

# Builds the docs on GitHub Actions (enough memory for all three locales)
# and deploys the static output in docs/dist to Cloudflare Workers.
# Replaces Cloudflare Workers Builds, which times out on the full build.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels the older one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run docs:build

      # Label the deployment with the commit so the Cloudflare dashboard
      # shows what was shipped instead of "Manually deployed".
      # For GitHub merge commits, use "#<PR> <PR title>" from the commit body.
      - name: Prepare deployment message
        id: meta
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^Merge\ pull\ request\ (#[0-9]+) ]]; then
            title="$(git log -1 --format=%b | sed '/^[[:space:]]*$/d' | head -n1)"
            subject="${BASH_REMATCH[1]} ${title:-$subject}"
          fi
          msg="$(printf '%s %s' "$sha" "$subject" | tr -d '"\\`$' | cut -c1-90)"
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      # The message reaches the shell via env, never via ${{ }} in the script,
      # so characters in a commit subject cannot break or inject commands.
      # wrangler v4: wrangler.jsonc needs >= 3.91.
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy --message "$DEPLOY_MESSAGE"
        env:
          DEPLOY_MESSAGE: ${{ steps.meta.outputs.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}